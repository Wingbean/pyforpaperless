<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataSlothy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <style>
        body {
            background-color: #343a40; /* สีพื้นหลังโทนเข้ม */
            color: #f8f9fa; /* สีข้อความสว่าง */
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .main-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        footer {
            margin-top: 40px; /* เพิ่มระยะห่างจากส่วนบน */
            padding: 10px 0;
            font-size: 0.9rem;
            color: #adb5bd; /* สีข้อความรอง */
        }
    </style>
</head>
<body>
    <h1 class="main-title">Welcome to DataSlothy</h1>

    <footer class="powered-by">
        Power by DataSloth Team
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
</body>
</html>
