{% extends 'myapp/base.html'%}

{% block title %} ลบข้อมูลการสมัครงาน {% endblock title %}

{% block content %}

<div class="container mt-5">
    <h2>ยืนยันการลบ</h2>
    <p>คุณต้องการลบข้อมูลของ {{ job.fullname}} <br>ตำแหน่ง {{ job.position }} ใช่หรือไม่?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">ลบ</button>
        <a href="{% url 'table-job' %}" class="btn btn-secondary">ยกเลิก</a>
    </form>
</div>

{% endblock content%}
